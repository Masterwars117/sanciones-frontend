name: ${DOCKER_DEV_NAME}

services:
  nuxt:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    user: node
    volumes:
      - ../../:/app
    env_file:
      - ../../.env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      # Dentro del contenedor, localhost no es el backend Django
      NUXT_API_BACKEND_URL: http://django:8000/api
    ports:
      - '${DOCKER_DEV_NUXT_PORT}:3000'
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    init: true
    networks:
      - default
      - sanciones-backend

networks:
  sanciones-backend:
    external: true
    name: sanciones-backend-dev_default
